<!DOCTYPE html>

  <meta name="theme-color" content="#F7F7FB">
  <script>
    try {
      if (localStorage.getItem("theme") === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="style.css">

  <header class="nav">
    <a class="logo" href="#home">~/<span data-i18n="logo"></span></a>
    <nav>

      <a href="#skills" data-i18n="nav_skills"></a>
      <a href="#projects" data-i18n="nav_projects"></a>

    </nav>
    <div class="tools">

        <svg class="icon-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>

      </button>
      <button id="lang-btn" class="pill-btn" type="button" aria-label="Change language">EN</button>

          <img class="photo" src="profile.jpg" alt="Mohammed Hossam">

    <section id="skills" class="reveal">
      <h2><span class="num">02</span><span data-i18n="skills_title"></span></h2>
      <ul class="skills" id="skills-list"></ul>
    </section>

    <section id="projects" class="reveal">
      <h2><span class="num">03</span><span data-i18n="projects_title"></span></h2>
      <div class="projects" id="projects-grid"></div>
    </section>

    <section id="contact" class="reveal">
      <h2><span class="num">04</span><span data-i18n="contact_title"></span></h2>
      <p class="contact-text" data-i18n="contact_text"></p>
      <ul class="links">
        <li><a href="https://mail.google.com/mail/?view=cm&fs=1&to=mohammedelsherbeny506@gmail.com" target="_blank" rel="noopener"><span>Email</span><span class="arrow">↗</span></a></li>

        <li><a href="https://wa.me/201016709832" target="_blank" rel="noopener"><span>WhatsApp</span><span class="arrow">↗</span></a></li>
        <li><a href="https://www.facebook.com/share/1FWx9S9cjT/" target="_blank" rel="noopener"><span>Facebook</span><span class="arrow">↗</span></a></li>
